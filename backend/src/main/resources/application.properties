server.port=8000

# Spring Application Name
spring.application.name=virtual-ca-system

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Static Resource Handling for Frontend Dashboard
spring.web.resources.static-locations=file:frontend/,file:../frontend/,classpath:/static/frontend/,classpath:/static/

# Application Admin & Security Keys
virtualca.admin.secret-key=admin2026
virtualca.admin.dev-key=dev2026
